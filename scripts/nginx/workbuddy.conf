# WorkBuddy Remote —— Nginx 站点示例
#
#   sudo cp scripts/nginx/workbuddy.conf /etc/nginx/conf.d/
#   sudo sed -i 's|__SERVER_NAME__|wb.example.com|' /etc/nginx/conf.d/workbuddy.conf
#   sudo sed -i 's|__CERT__|/etc/ssl/fullchain.pem|; s|__KEY__|/etc/ssl/privkey.pem|' /etc/nginx/conf.d/workbuddy.conf
#   sudo htpasswd -c /etc/nginx/wb.htpasswd yourname
#   sudo nginx -t && sudo systemctl reload nginx
#
# 说明：
#   - 家庭宽带常封 80/443，可把 listen 改成自定义端口（记得同步改访问地址）
#   - 只暴露这一个端口，VNC(5900) / websockify(6080) / 剪贴板桥(8137) 都只在回环

server {
    listen 443 ssl;
    http2 on;
    server_name __SERVER_NAME__;

    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:wbssl:10m;
    ssl_session_timeout 1h;

    client_max_body_size 32m;          # 允许粘贴较大的截图

    # 单一口令，覆盖页面与 /clip/
    auth_basic           "WorkBuddy Remote";
    auth_basic_user_file /etc/nginx/wb.htpasswd;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # 剪贴板 / 分辨率接口（与页面同源，复用上面的 Basic 认证）
    location /clip/ {
        proxy_pass http://127.0.0.1:8137/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # noVNC 静态页 + WebSocket（websockify 同时提供两者）
    location / {
        proxy_pass http://127.0.0.1:6080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 这两个是远程桌面流畅与否的关键
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

