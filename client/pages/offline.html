<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>连接失败</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    background: #f5f6f8; color: #1f2329;
    display: flex; align-items: center; justify-content: center;
  }
  .box { text-align: center; max-width: 560px; padding: 40px; }
  h1 { font-size: 22px; margin: 0 0 12px; font-weight: 600; }
  p { color: #646a73; font-size: 14px; line-height: 1.9; margin: 6px 0; }
  .reason { color: #b26a00; background: #fff7e6; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-top: 16px; word-break: break-all; }
  button {
    margin-top: 26px; padding: 11px 30px; font-size: 15px; color: #fff; cursor: pointer;
    background: #1c9d6e; border: 0; border-radius: 8px; font-family: inherit;
  }
  button:hover { background: #178a60; }
  .tip { margin-top: 22px; font-size: 12px; color: #8a9099; }
</style>
</head>
<body>
  <div class="box">
    <h1>无法连接到 WorkBuddy 服务器</h1>
    <p>请确认网络正常，且服务器已开机、服务在运行。</p>
    <p>连接恢复后点击下面的按钮重新连接。</p>
    <div class="reason" id="reason"></div>
    <button id="retry">重新连接</button>
    <div class="tip">提示：右键窗口可修改服务器地址，或按 F5 刷新</div>
  </div>
<script>
  var q = new URLSearchParams(location.search);
  var target = decodeURIComponent(q.get('u') || '');
  var reason = q.get('r') || '';
  document.getElementById('reason').textContent = reason ? ('错误信息：' + reason) : '服务器无响应';
  document.getElementById('retry').addEventListener('click', function () {
    if (target) location.href = target;
  });
</script>
</body>
</html>
